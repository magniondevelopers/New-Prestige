<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Blog | Prestige Vacations & Clubs</title>
<style>
.blog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:28px;max-width:1200px;margin:0 auto;padding:0 20px;}
.blog-card{border-radius:12px;overflow:hidden;background:#fff;border:1px solid #e5e7eb;transition:.25s;cursor:pointer;text-decoration:none;display:block;color:inherit;}
.blog-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.1);}
.blog-card-img{width:100%;height:200px;object-fit:cover;}
.blog-card-body{padding:20px;}
.blog-cat{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#d1a84b;margin-bottom:8px;}
.blog-card-title{font-size:17px;font-weight:800;color:#1a1a17;margin-bottom:8px;line-height:1.4;}
.blog-card-excerpt{font-size:13px;color:#6b7280;line-height:1.6;margin-bottom:12px;}
.blog-meta{display:flex;align-items:center;gap:12px;font-size:11px;color:#9ca3af;}
.blog-empty{text-align:center;padding:80px 20px;color:#9ca3af;}
</style>
</head>
<body>
<!-- YOUR EXISTING HEADER/NAV HERE -->

<section style="padding:60px 0;">
  <div style="text-align:center;margin-bottom:48px;">
    <h2>Prestige Blog</h2>
    <p style="color:#6b7280;">Travel stories, tips & membership insights</p>
  </div>
  <div class="blog-grid" id="blogGrid"><div class="blog-empty">Loading posts...</div></div>
</section>

<!-- YOUR EXISTING FOOTER HERE -->

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, collection, query, where, orderBy, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const app = initializeApp({
  apiKey:"AIzaSyANFWqwFqFuWGNzjZS2crbr_WJ29eSDdRU",
  authDomain:"prestigevacations.firebaseapp.com",
  projectId:"prestigevacations",
  storageBucket:"prestigevacations.firebasestorage.app",
  messagingSenderId:"294803443782",
  appId:"1:294803443782:web:a3433f81c5af6a56153a47"
});
const db = getFirestore(app);

async function loadBlog() {
  const snap = await getDocs(query(collection(db,'blog_posts'), where('status','==','published'), orderBy('created','desc')));
  const grid = document.getElementById('blogGrid');
  if (snap.empty) { grid.innerHTML = '<div class="blog-empty">No posts yet. Check back soon!</div>'; return; }
  const posts = [];
  snap.forEach(d => posts.push({id:d.id,...d.data()}));
  grid.innerHTML = posts.map(p => `
    <a class="blog-card" href="prestige-blog-post.html?id=${p.id}">
      <img class="blog-card-img" src="${p.coverUrl||'https://via.placeholder.com/640x400/1a1a17/C9A44B?text=Prestige+Blog'}" alt="${p.title}"/>
      <div class="blog-card-body">
        <div class="blog-cat">${p.category||'Blog'}</div>
        <div class="blog-card-title">${p.title}</div>
        <div class="blog-card-excerpt">${(p.excerpt||(p.content||'').replace(/<[^>]+>/g,'')).substring(0,120)}...</div>
        <div class="blog-meta">
          <span>✍ ${p.author||'Prestige'}</span>
          <span>·</span>
          <span>${p.created?.toDate ? p.created.toDate().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : ''}</span>
        </div>
      </div>
    </a>`).join('');
}
loadBlog();
</script>
</body>
</html>
