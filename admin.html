<head>

<link

<link

  crossorigin

<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"

<link

<style>

/* =========================================
   COLORS
========================================= */

:root{

  --black:#1a1a17;
  --panel:#22211d;
  --panel2:#2b2924;

  --gold:#d9ba6f;
  --cream:#f2e7c7;

  --silver:#dcdcdc;
  --muted:#99968e;

  --danger:#d96b6b;
  --success:#73bd8b;

}


/* =========================================
   RESET
========================================= */

*{
  box-sizing:border-box;
}


html,
body{
  margin:0;
  padding:0;
  min-height:100%;
}


body{
  background:var(--black);
  color:var(--silver);
  font-family:Montserrat,sans-serif;
}


button,
input,
textarea,
select{
  font:inherit;
}


button{
  cursor:pointer;
}


.hidden{
  display:none !important;
}


/* =========================================
   LOGIN
========================================= */

.login-wrap{

  min-height:100vh;

  display:grid;

  place-items:center;

  padding:20px;

}


.login-card{

  width:min(430px,100%);

  background:var(--panel);

  border:
    1px solid
    rgba(217,186,111,.25);

  padding:40px;

  border-radius:18px;

  box-shadow:
    0 20px 70px #0008;

}


.brand{

  text-align:center;

  color:var(--gold);

  font-family:
    'Cormorant Garamond',
    serif;

}


.sub{

  text-align:center;

  color:var(--muted);

  font-size:11px;

  letter-spacing:2px;

  text-transform:uppercase;

  margin:
    5px 0 30px;

}


.field{
  margin-bottom:17px;
}


.field label{

  display:block;

  font-size:11px;

  text-transform:uppercase;

  letter-spacing:1.5px;

  margin-bottom:7px;

  color:var(--cream);

}


input,
textarea,
select{

  width:100%;

  background:#171612;

  border:1px solid #49463e;

  color:#fff;

  border-radius:8px;

  padding:13px;

  outline:none;

}


input:focus,
textarea:focus,
select:focus{

  border-color:var(--gold);

}


textarea{

  min-height:140px;

  resize:vertical;

}


.btn{

  border:0;

  border-radius:8px;

  padding:13px 18px;

  cursor:pointer;

  font-weight:700;

  letter-spacing:.5px;

  transition:.15s;

}


.btn:hover{
  transform:translateY(-1px);
}


.btn:disabled{

  opacity:.5;

  cursor:not-allowed;

  transform:none;

}


.btn-gold{

  background:var(--gold);

  color:#181711;

}


.btn-outline{

  background:transparent;

  border:
    1px solid #666;

  color:#fff;

}


.btn-danger{

  background:#512b2b;

  color:#ffd6d6;

}


.btn-success{

  background:#234c32;

  color:#d7ffe2;

}


.error{

  color:#ffd1d1;

  padding:13px;

  border-radius:7px;

  font-size:12px;

  line-height:1.7;

  margin-bottom:15px;

  white-space:pre-line;

  word-break:break-word;

}


.info{

  background:#302c1f;

  color:#ffe5a4;

  padding:13px;

  border-radius:7px;

  font-size:12px;

  line-height:1.7;

  margin-bottom:15px;

  white-space:pre-line;

  word-break:break-word;

}


.small{

  font-size:11px;

  color:var(--muted);

  line-height:1.6;

}


/* =========================================
   HEADER
========================================= */

  min-height:100vh;

}


.topbar{

  height:72px;

  border-bottom:
    1px solid #38362f;

  background:#1c1b18;

  display:flex;

  align-items:center;

  padding:0 28px;

  position:sticky;

}


.topbrand{

}


.user{

  color:var(--muted);

}


.logout{

}


/* =========================================
   CONTENT
========================================= */

.container{

  padding:30px 20px;

}


.stats{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  margin-bottom:25px;

}


.stat{

  background:var(--panel);

  border-radius:13px;

  padding:22px;

}


.stat .num{

  color:var(--gold);

  font-weight:700;

}


.stat .label{

  text-transform:uppercase;

  letter-spacing:1.5px;

  color:var(--muted);

  margin-top:6px;

}


.layout{

  display:grid;

  grid-template-columns:400px 1fr;

  gap:20px;

}


.card{

  background:var(--panel);

  border:
    1px solid #3a3831;

  border-radius:13px;

  padding:22px;

}


.card h2{

  font-family:
    'Cormorant Garamond',
    serif;

  color:var(--cream);

  font-size:28px;

  margin:
    0 0 20px;

}


.row{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:12px;

}


.actions{

  display:flex;

  gap:9px;

  flex-wrap:wrap;

  margin-top:15px;

}


/* =========================================
   STARS
========================================= */

.stars{

  display:flex;

  gap:7px;

  margin:
    5px 0 18px;

}


.star{

  font-size:30px;

  color:#555;

  cursor:pointer;

  transition:.15s;

}


.star:hover{

  transform:
    scale(1.08);

}


.star.active{

  color:var(--gold);

}


/* =========================================
   REVIEWS
========================================= */

.review-list{

  display:grid;

  gap:12px;

}


.review{

  background:var(--panel2);

  border:
    1px solid #46433a;

  border-radius:11px;

  padding:17px;

}


.review-head{

  display:flex;

  justify-content:
    space-between;

  gap:10px;

}


.review-name{

  font-weight:700;

  color:#fff;

}


.review-meta{

  font-size:11px;

  color:var(--muted);

  margin-top:3px;

}


.review-stars{

  color:var(--gold);

  letter-spacing:2px;

}


.review-text{

  font-size:13px;

  line-height:1.7;

  margin:13px 0;

  color:#ddd;

  white-space:pre-wrap;

}


.badge{

  display:inline-block;

  font-size:9px;

  padding:5px 8px;

  border-radius:20px;

  text-transform:uppercase;

  letter-spacing:1px;

  margin-top:5px;

}


.published{

  background:#234c32;

  color:#bdf1ca;

}


.draft{

  background:#4b4021;

  color:#ffe3a2;

}


.empty{

  text-align:center;

  color:var(--muted);

  padding:50px;

}


.toast{

  position:fixed;

  right:20px;

  bottom:20px;

  background:#292722;

  border:
    1px solid #5b5547;

  padding:13px 18px;

  border-radius:8px;

  display:none;

  z-index:50;

  max-width:450px;

  line-height:1.6;

}


.toast.show{
  display:block;
}


/* =========================================
   RESPONSIVE
========================================= */

@media(max-width:900px){

  .layout{

      1fr;

  }


  .stats{

      repeat(2,1fr);

}


@media(max-width:520px){

  .user{

  }

  }


  .stats{

    grid-template-columns:
      1fr 1fr;

  }


  .row{

    grid-template-columns:
      1fr;

  }


  .login-card{

    padding:
      28px 20px;

  }

}

</style>

</head>

<!-- =========================================
     FIREBASE CODE
========================================= -->

<script type="module">


/* =========================================
   IMPORT FIREBASE
========================================= */

import {

  initializeApp

}

from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {

  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signOut

}

from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {

  getFirestore,
  collection,
  doc,
  getDoc,
  addDoc,
  updateDoc,
  deleteDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp

}

from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


import {

  firebaseConfig

}

from
  "./firebase-config.js";


/* =========================================
   INITIALIZE
========================================= */

const firebaseApp =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(
    firebaseApp
  );


const db =
  getFirestore(
    firebaseApp
  );


const reviewsRef =
  collection(
    db,
    "reviews"
  );


/* =========================================
   STATE
========================================= */

let currentUser =
  null;

let reviews =
  [];

let rating =
  5;

let unsubscribeReviews =
  null;

let initializing =
  false;


/* =========================================
   HELPER
========================================= */

const $ =
  id =>
    document.getElementById(id);


/* =========================================
   ERROR MESSAGES
========================================= */

function authMessage(
  code
){

  const messages = {

    "auth/invalid-email":
      "Invalid email address.",

    "auth/user-not-found":
      "No Firebase user exists with this email.",

    "auth/wrong-password":
      "Incorrect password.",

    "auth/invalid-credential":
      "Incorrect email or password.",

    "auth/user-disabled":
      "This Firebase user has been disabled.",

    "auth/too-many-requests":
      "Too many attempts. Try again later.",

    "auth/network-request-failed":
      "Network error. Check your internet connection.",

    "auth/operation-not-allowed":
      "Email/Password authentication is not enabled in Firebase.",

    "auth/app-not-authorized":
      "This domain is not authorized in Firebase Authentication."

  };


  return (
    messages[code] ||
    "Authentication error: " +
    code
  );

}


/* =========================================
   FIRESTORE ERROR
========================================= */

function firestoreMessage(
  error
){

  console.error(
    "Firestore:",
    error
  );


  if (
    error?.code ===
    "permission-denied"
  ){

    return (
      "Firestore permission denied. " +
      "Check Firestore Rules."
    );

  }


  if (
    error?.code ===
    "unavailable"
  ){

    return (
      "Firestore is currently unavailable. " +
      "Make sure Firestore Database is created " +
      "in the prestigevacations Firebase project " +
      "and that your browser/network can reach Firebase."
    );

  }


  if (
    error?.code ===
    "failed-precondition"
  ){

    return (
      "Firestore configuration/index problem."
    );

  }


  return (
    error?.message ||
    "Unknown Firestore error."
  );

}


/* =========================================
   UI
========================================= */

){

    .classList
    .add("hidden");


  $("loginError")
    .textContent =
      message;

}


function showInfo(

){

    .classList
    .add("hidden");


  $("loginInfo")
    .textContent =
      message;


  $("loginInfo")
    .classList
    .remove("hidden");

}


function clearMessages(){

  $("loginError")
    .classList
    .add("hidden");


  $("loginInfo")
    .classList
    .add("hidden");


  $("loginError")
    .textContent =
      "";


  $("loginInfo")
    .textContent =
      "";

}


function setLoading(
  loading
){

  $("loginBtn")
    .disabled =
      loading;


  $("loginText")
    .textContent =
      loading
        ? "Signing In..."
        : "Sign In";

}


function toast(
  message
){

  $("toast")
    .textContent =
      message;


  $("toast")
    .classList
    .add("show");


  setTimeout(
    () => {

      $("toast")
        .classList
        .remove("show");

    },
    3500
  );

}


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  ).replace(
    /[&<>'"]/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "'":"&#39;",
      '"':"&quot;"
    }[c])
  );

}


/* =========================================
   STARS
========================================= */

function setStars(
  value
){

  rating =
    Math.max(
      1,
      Math.min(
        5,
        Number(value) || 5
      )
    );


  document
    .querySelectorAll(
      ".star"
    )
    .forEach(
      (star,index) => {

        star.classList.toggle(
          "active",
          index < rating
        );

      }
    );

}


function initStars(){

  $("stars").innerHTML =
    "";


  for(
    let i = 1;
    i <= 5;
    i++
  ){

    const star =
      document.createElement(
        "span"
      );


    star.className =
      "star";


    star.textContent =
      "★";


    star.onclick =
      () =>
        setStars(i);


    $("stars")
      .appendChild(
        star
      );

  }


  setStars(5);

}


/* =========================================
   DATE
========================================= */

function formatDate(
  value
){

  try{

    const date =
      value?.toDate
        ? value.toDate()
        : new Date(value);


    if(
      Number.isNaN(
        date.getTime()
      )
    ){

      return "";

    }


    return date.toLocaleDateString(
      "en-IN",
      {
        day:"2-digit",
        month:"short",
        year:"numeric"
      }
    );


  }catch{

    return "";

  }

}


/* =========================================
   RESET
========================================= */

function resetForm(){

  $("reviewForm")
    .reset();


  $("reviewId")
    .value =
      "";


  $("formTitle")
    .textContent =
      "Add Review";


  $("saveText")
    .textContent =
      "Save Review";


  $("cancelEdit")
    .classList
    .add("hidden");


  $("published")
    .checked =
      true;


  $("date")
    .value =
      new Date()
        .toISOString()
        .slice(0,10);


  setStars(
    5
  );

}


/* =========================================
   RENDER
========================================= */

function renderReviews(){

  $("totalCount")
    .textContent =
      reviews.length;


  const published =
    reviews.filter(
      r =>
        r.published === true
    );


  $("publishedCount")
    .textContent =
      published.length;


  const totalRating =
    reviews.reduce(
      (
        total,
        review
      ) => {

        return (
          total +
          Number(
            review.rating || 0
          )
        );

      },
      0
    );


  const average =
    reviews.length
      ? totalRating /
        reviews.length
      : 0;


  $("averageRating")
    .textContent =
      average.toFixed(1) +
      " ⭐";


  $("fiveStarCount")
    .textContent =
      reviews.filter(
        r =>
          Number(
            r.rating
          ) === 5
      ).length;


  const list =
    $("reviewList");


  if(
    !reviews.length
  ){

    list.innerHTML =
      '<div class="empty">No reviews yet.</div>';

    return;

  }


  list.innerHTML =
    reviews.map(
      review => {

        return `

          <article class="review">

            <div class="review-head">

              <div>

                <div class="review-name">

                  ${escapeHTML(
                    review.name
                  )}

                </div>


                <div class="review-meta">

                  ${escapeHTML(
                    review.location || ""
                  )}

                  ${
                    review.location
                      ? " · "
                      : ""
                  }

                  ${escapeHTML(
                    review.categoryLabel ||
                    review.category ||
                    ""
                  )}

                </div>

              </div>


              <div
                style="
                  text-align:right;
                "
              >

                <div class="review-stars">

                  ${
                    "★".repeat(
                      Number(
                        review.rating
                      ) || 0
                    )
                  }

                </div>


                <span
                  class="badge ${
                    review.published
                      ? "published"
                      : "draft"
                  }"
                >

                  ${
                    review.published
                      ? "Published"
                      : "Draft"
                  }

                </span>

              </div>

            </div>


            <div class="review-text">

              ${escapeHTML(
                review.review
              )}

            </div>


            <div class="small">

              ${escapeHTML(
                review.source || ""
              )}

              ${
                review.source
                  ? " · "
                  : ""
              }

              ${formatDate(
                review.date ||
                review.createdAt
              )}

            </div>


            <div class="actions">

              <button
                class="btn btn-outline edit"
                data-id="${review.id}"
                type="button"
              >

                <i
                  class="fa-solid fa-pen"
                ></i>

                Edit

              </button>


              <button
                class="btn ${
                  review.published
                    ? "btn-danger"
                    : "btn-success"
                } toggle"
                data-id="${review.id}"
                type="button"
              >

                ${
                  review.published
                    ? "Unpublish"
                    : "Publish"
                }

              </button>


              <button
                class="btn btn-danger delete"
                data-id="${review.id}"
                type="button"
              >

                <i
                  class="fa-solid fa-trash"
                ></i>

                Delete

              </button>

            </div>

          </article>

        `;

      }
    ).join("");


  list
    .querySelectorAll(
      ".edit"
    )
    .forEach(
      button => {

        button.onclick =
          () =>
            editReview(
              button.dataset.id
            );

      }
    );


  list
    .querySelectorAll(
      ".toggle"
    )
    .forEach(
      button => {

        button.onclick =
          () =>
            toggleReview(
              button.dataset.id
            );

      }
    );


  list
    .querySelectorAll(
      ".delete"
    )
    .forEach(
      button => {

        button.onclick =
          () =>
            deleteReview(
              button.dataset.id
            );

      }
    );

}


/* =========================================
   LOAD REVIEWS
========================================= */

function loadReviews(){

  if(
    unsubscribeReviews
  ){

    unsubscribeReviews();

    unsubscribeReviews =
      null;

  }


  const q =
    query(
      reviewsRef,
      orderBy(
        "createdAt",
        "desc"
      )
    );


  unsubscribeReviews =
    onSnapshot(
      q,

      snapshot => {

        reviews =
          snapshot.docs.map(
            item => ({
              id:item.id,
              ...item.data()
            })
          );


        renderReviews();

      },

      error => {

        console.error(
          error
        );


        toast(
          firestoreMessage(
            error
          )
        );

      }
    );

}


/* =========================================
   EDIT
========================================= */

function editReview(
  id
){

  const review =
    reviews.find(
      item =>
        item.id === id
    );


  if(!review){
    return;
  }


  $("reviewId")
    .value =
      id;


  $("formTitle")
    .textContent =
      "Edit Review";


  $("saveText")
    .textContent =
      "Update Review";


  $("cancelEdit")
    .classList
    .remove("hidden");


  $("name")
    .value =
      review.name || "";


  $("location")
    .value =
      review.location || "";


  $("date")
    .value =
      review.dateValue || "";


  $("category")
    .value =
      review.category ||
      "membership";


  $("source")
    .value =
      review.source ||
      "Google Review";


  $("review")
    .value =
      review.review || "";


  $("published")
    .checked =
      review.published === true;


  setStars(
    Number(
      review.rating
    ) || 5
  );


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================
   TOGGLE
========================================= */

async function toggleReview(
  id
){

  const review =
    reviews.find(
      item =>
        item.id === id
    );


  if(!review){
    return;
  }


  try{

    await updateDoc(
      doc(
        db,
        "reviews",
        id
      ),
      {
        published:
          !review.published,

        updatedAt:
          serverTimestamp()
      }
    );


    toast(
      review.published
        ? "Review unpublished."
        : "Review published."
    );


  }catch(error){

    toast(
      firestoreMessage(
        error
      )
    );

  }

}


/* =========================================
   DELETE
========================================= */

async function deleteReview(
  id
){

  if(
    !confirm(
      "Delete this review permanently?"
    )
  ){

    return;
  }


  try{

    await deleteDoc(
      doc(
        db,
        "reviews",
        id
      )
    );


    toast(
      "Review deleted."
    );


  }catch(error){

    toast(
      firestoreMessage(
        error
      )
    );

  }

}


/* =========================================
   CHECK ADMIN
========================================= */

async function checkAdmin(
  user
){

  const adminRef =
    doc(
      db,
      "admins",
      user.uid
    );


  try{

    const snapshot =
      await getDoc(
        adminRef
      );


    if(
      !snapshot.exists()
    ){

      return {
        ok:false,

        message:
`Login successful, but this Firebase account is not an admin.

Create this Firestore document:

Collection:
admins

Document ID:
${user.uid}

Field:
enabled

Type:
Boolean

Value:
true`
      };

    }


    const data =
      snapshot.data();


    if(
      data.enabled !== true
    ){

      return {
        ok:false,

        message:
`The admin document exists, but enabled is not true.

Set:

admins/${user.uid}

enabled = true`
      };

    }


    return {
      ok:true
    };


  }catch(error){

    return {
      ok:false,

      message:
        firestoreMessage(
          error
        )
    };

  }

}


/* =========================================
   SHOW DASHBOARD
========================================= */

async function showDashboard(
  user
){

  if(
    initializing
  ){

    return;
  }


  initializing =
    true;


  try{

    showInfo(
      "Checking administrator access..."
    );


    const result =
      await checkAdmin(
        user
      );


    if(
      !result.ok
    ){

      await signOut(
        auth
      );


      showError(
        result.message
      );


      return;
    }


    /*
     * ADMIN VERIFIED
     */

    currentUser =
      user;


    $("loginScreen")
      .classList
      .add("hidden");


    $("app")
      .classList
      .remove("hidden");


    $("userEmail")
      .textContent =
        user.email || "";


    initStars();

    resetForm();

    loadReviews();


  } finally {

    initializing =
      false;
  }

}


/* =========================================
   LOGIN
========================================= */

$("loginForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      clearMessages();


      const email =
        $("email")
          .value
          .trim();


      const password =
        $("password")
          .value;


      if(
        !email ||
        !password
      ){

        showError(
          "Please enter your email and password."
        );

        return;
      }


      setLoading(
        true
      );


      try{

        showInfo(
          "Signing in..."
        );


        /*
         * Firebase Authentication
         */

        const credential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        /*
         * Credentials are valid.
         */

        showInfo(
          "Credentials accepted. Opening admin panel..."
        );


        /*
         * Check admin.
         */

        await showDashboard(
          credential.user
        );


      }catch(error){

        console.error(
          "LOGIN ERROR:",
          error
        );


        if(
          error?.code &&
          error.code.startsWith(
            "auth/"
          )
        ){

          showError(
            authMessage(
              error.code
            )
          );

        }else{

          showError(
            firestoreMessage(
              error
            )
          );

        }

      }finally{

        setLoading(
          false
        );

      }

    }
  );


/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(
  auth,
  async user => {

    if(
      !user
    ){

      currentUser =
        null;


      if(
        unsubscribeReviews
      ){

        unsubscribeReviews();

        unsubscribeReviews =
          null;

      }


      $("app")
        .classList
        .add("hidden");


      $("loginScreen")
        .classList
        .remove("hidden");


      return;

    }


    /*
     * Firebase restored a previous session.
     */

    if(
      $("app")
        .classList
        .contains(
          "hidden"
        )
    ){

      try{

        await showDashboard(
          user
        );

      }catch(error){

        console.error(
          error
        );

        await signOut(
          auth
        );


        showError(
          error?.message ||
          "Could not restore your admin session."
        );

      }

    }

  }
);


/* =========================================
   LOGOUT
========================================= */

$("logoutBtn")
  .addEventListener(
    "click",
    async () => {

      try{

        if(
          unsubscribeReviews
        ){

          unsubscribeReviews();

          unsubscribeReviews =
            null;

        }


        await signOut(
          auth
        );


        reviews =
          [];


        resetForm();


      }catch(error){

        toast(
          error?.message ||
          "Logout failed."
        );

      }

    }
  );


/* =========================================
   CANCEL
========================================= */

$("cancelEdit")
  .addEventListener(
    "click",
    resetForm
  );


/* =========================================
   SAVE REVIEW
========================================= */

$("reviewForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      if(
        !currentUser
      ){

        toast(
          "Please sign in again."
        );

        return;
      }


      const button =
        $("saveButton");


      button.disabled =
        true;


      const data = {

        name:
          $("name")
            .value
            .trim(),

        location:
          $("location")
            .value
            .trim(),

        rating:
          Number(
            rating
          ),

        dateValue:
          $("date")
            .value,

        date:
          new Date(
            $("date").value +
            "T12:00:00"
          ),

        review:
          $("review")
            .value
            .trim(),

        category:
          $("category")
            .value,

        categoryLabel:
          $("category")
            .selectedOptions[0]
            .textContent,

        source:
          $("source")
            .value,

        published:
          $("published")
            .checked,

        updatedAt:
          serverTimestamp()

      };


      try{

        const id =
          $("reviewId")
            .value;


        if(
          id
        ){

          await updateDoc(
            doc(
              db,
              "reviews",
              id
            ),
            data
          );


          toast(
            "Review updated successfully."
          );


        }else{

          data.createdAt =
            serverTimestamp();


          await addDoc(
            reviewsRef,
            data
          );


          toast(
            "Review added successfully."
          );

        }


        resetForm();


      }catch(error){

        toast(
          firestoreMessage(
            error
          )
        );


      }finally{

        button.disabled =
          false;

      }

    }
  );

</script>
