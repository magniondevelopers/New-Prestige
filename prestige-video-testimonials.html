<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Video Testimonials | Prestige Vacations & Clubs</title>
<style>
.reels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;max-width:1100px;margin:0 auto;padding:0 20px;}
.reel-card{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:9/16;max-height:356px;background:#000;cursor:pointer;}
.reel-card img{width:100%;height:100%;object-fit:cover;opacity:.88;transition:.3s;}
.reel-card:hover img{opacity:.7;}
.reel-play-btn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
.play-circle{width:56px;height:56px;background:rgba(255,255,255,.95);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#1a1a17;transition:.2s;}
.reel-card:hover .play-circle{transform:scale(1.1);background:#fff;}
.reel-caption-bar{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.85));padding:24px 12px 14px;color:#fff;font-size:12px;font-weight:600;}
/* Lightbox */
.reel-lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.reel-lb.open{display:flex;}
.reel-lb-close{position:fixed;top:20px;right:24px;background:none;border:none;color:#fff;font-size:28px;cursor:pointer;}
.reel-lb-frame{width:min(405px,90vw);aspect-ratio:9/16;border-radius:8px;overflow:hidden;background:#000;}
.reel-lb-frame iframe{width:100%;height:100%;border:none;}
.reel-lb-link{color:#d1a84b;font-size:13px;text-decoration:none;}
.reels-empty{text-align:center;padding:80px;color:#9ca3af;grid-column:1/-1;}
</style>
</head>
<body>
<!-- YOUR EXISTING HEADER/NAV HERE -->

<section style="padding:60px 0;">
  <div style="text-align:center;margin-bottom:48px;">
    <h2>Member Stories</h2>
    <p style="color:#6b7280;">Real experiences, straight from our members</p>
  </div>
  <div class="reels-grid" id="reelsGrid"><div class="reels-empty">Loading...</div></div>
</section>

<!-- Lightbox -->
<div class="reel-lb" id="reelLb">
  <button class="reel-lb-close" onclick="closeLb()">✕</button>
  <div class="reel-lb-frame" id="reelFrame"></div>
  <a id="reelDirectLink" href="#" target="_blank" class="reel-lb-link">Open in Instagram ↗</a>
</div>

<!-- YOUR EXISTING FOOTER HERE -->

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, collection, query, where, orderBy, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
const app = initializeApp({
  apiKey:"AIzaSyANFWqwFqFuWGNzjZS2crbr_WJ29eSDdRU",
  authDomain:"prestigevacations.firebaseapp.com",
  projectId:"prestigevacations",
  storageBucket:"prestigevacations.firebasestorage.app",
  messagingSenderId:"294803443782",
  appId:"1:294803443782:web:a3433f81c5af6a56153a47"
});
const db = getFirestore(app);
const DEFAULT_THUMB = 'https://via.placeholder.com/405x720/1a1a17/C9A44B?text=Prestige';

const snap = await getDocs(query(collection(db,'testimonials'), where('status','==','published'), orderBy('created','desc')));
const grid = document.getElementById('reelsGrid');

if (snap.empty) { grid.innerHTML='<div class="reels-empty">No testimonials yet. Check back soon!</div>'; }
else {
  const reels=[];
  snap.forEach(d=>reels.push({id:d.id,...d.data()}));
  grid.innerHTML = reels.map(r=>`
    <div class="reel-card" onclick="openReel('${r.reelUrl.replace(/'/g,"\\'")}')">
      <img src="${r.thumbnailUrl||DEFAULT_THUMB}" alt="${r.caption||'Prestige testimonial'}" loading="lazy"/>
      <div class="reel-play-btn">
        <div class="play-circle">▶</div>
      </div>
      <div class="reel-caption-bar">${r.caption||''}</div>
    </div>`).join('');
}

function getEmbedUrl(url) {
  // Extract reel ID and build embed URL
  const match = url.match(/instagram\.com\/(?:reel|p)\/([^/?]+)/);
  if (match) return `https://www.instagram.com/reel/${match[1]}/embed/`;
  return url;
}

window.openReel = function(url) {
  document.getElementById('reelFrame').innerHTML = `<iframe src="${getEmbedUrl(url)}" allowfullscreen scrolling="no" allowtransparency></iframe>`;
  document.getElementById('reelDirectLink').href = url;
  document.getElementById('reelLb').classList.add('open');
  document.body.style.overflow='hidden';
};
window.closeLb = function() {
  document.getElementById('reelFrame').innerHTML='';
  document.getElementById('reelLb').classList.remove('open');
  document.body.style.overflow='';
};
</script>
</body>
</html>
