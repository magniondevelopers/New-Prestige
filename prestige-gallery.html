<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Gallery | Prestige Vacations & Clubs</title>
<!-- Keep your existing <head> CSS/fonts here — only the gallery section changes -->
<style>
.gallery-filter{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:32px;}
.filter-btn{padding:8px 20px;border-radius:30px;border:1px solid #d1a84b;color:#d1a84b;background:transparent;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;}
.filter-btn:hover,.filter-btn.active{background:#d1a84b;color:#1a1a17;}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.gallery-photo{border-radius:10px;overflow:hidden;aspect-ratio:4/3;cursor:pointer;}
.gallery-photo img{width:100%;height:100%;object-fit:cover;transition:.3s;}
.gallery-photo:hover img{transform:scale(1.04);}
.gallery-empty{text-align:center;padding:60px;color:#9ca3af;}
/* Lightbox */
.lb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9000;align-items:center;justify-content:center;}
.lb-overlay.open{display:flex;}
.lb-img{max-width:90vw;max-height:90vh;border-radius:8px;object-fit:contain;}
.lb-close{position:fixed;top:20px;right:24px;color:#fff;font-size:28px;cursor:pointer;background:none;border:none;}
</style>
</head>
<body>
<!-- YOUR EXISTING HEADER/NAV HERE -->

<!-- GALLERY SECTION — replace your existing static gallery with this -->
<section class="gallery-section" style="padding:60px 20px;max-width:1200px;margin:0 auto;">
  <h2 style="text-align:center;margin-bottom:8px;">Gallery</h2>
  <p style="text-align:center;color:#6b7280;margin-bottom:40px;">Moments from Prestige Vacations & Clubs</p>

  <!-- Tag Filters (auto-generated) -->
  <div class="gallery-filter" id="galleryFilter">
    <button class="filter-btn active" onclick="filterGallery('all',this)">All</button>
    <!-- More tags loaded from Firebase -->
  </div>

  <!-- Photo Grid -->
  <div class="gallery-grid" id="galleryGrid">
    <div class="gallery-empty">Loading gallery...</div>
  </div>
</section>

<!-- Lightbox -->
<div class="lb-overlay" id="lbOverlay" onclick="closeLb()">
  <button class="lb-close" onclick="closeLb()">✕</button>
  <img class="lb-img" id="lbImg" src="" alt=""/>
</div>

<!-- YOUR EXISTING FOOTER HERE -->

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, collection, query, orderBy, where, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const app = initializeApp({
  apiKey:"AIzaSyANFWqwFqFuWGNzjZS2crbr_WJ29eSDdRU",
  authDomain:"prestigevacations.firebaseapp.com",
  projectId:"prestigevacations",
  storageBucket:"prestigevacations.firebasestorage.app",
  messagingSenderId:"294803443782",
  appId:"1:294803443782:web:a3433f81c5af6a56153a47"
});
const db = getFirestore(app);

let allPhotos = [];
let allTags   = [];

async function loadGallery() {
  // Load tags
  const tagSnap = await getDocs(query(collection(db,'gallery_tags'), orderBy('order')));
  allTags = [];
  tagSnap.forEach(d => allTags.push({id:d.id,...d.data()}));

  // Build filter buttons
  const filterEl = document.getElementById('galleryFilter');
  filterEl.innerHTML = '<button class="filter-btn active" onclick="filterGallery(\'all\',this)">All</button>';
  allTags.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.textContent = t.name;
    btn.onclick = () => filterGallery(t.id, btn);
    filterEl.appendChild(btn);
  });

  // Load photos
  const photoSnap = await getDocs(query(collection(db,'gallery_photos'), orderBy('created','desc')));
  allPhotos = [];
  photoSnap.forEach(d => allPhotos.push({id:d.id,...d.data()}));
  renderPhotos(allPhotos);
}

function renderPhotos(photos) {
  const grid = document.getElementById('galleryGrid');
  if (!photos.length) { grid.innerHTML = '<div class="gallery-empty">No photos in this category yet.</div>'; return; }
  grid.innerHTML = photos.map(p => `
    <div class="gallery-photo" onclick="openLb('${p.url.replace(/'/g,"\\'")}')">
      <img src="${p.url}" alt="${p.tagName||''}" loading="lazy"/>
    </div>`).join('');
}

window.filterGallery = function(tagId, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  if (tagId === 'all') renderPhotos(allPhotos);
  else renderPhotos(allPhotos.filter(p => p.tagId === tagId));
};

window.openLb = function(url) {
  document.getElementById('lbImg').src = url;
  document.getElementById('lbOverlay').classList.add('open');
};
window.closeLb = function() { document.getElementById('lbOverlay').classList.remove('open'); };

loadGallery();
</script>
</body>
</html>
