<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title id="pageTitle">Blog Post | Prestige Vacations</title>
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet"/>
<style>
.blog-hero{width:100%;max-height:480px;object-fit:cover;border-radius:12px;margin-bottom:32px;}
.blog-post-wrap{max-width:760px;margin:0 auto;padding:40px 20px;}
.blog-post-cat{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#d1a84b;margin-bottom:10px;}
.blog-post-title{font-size:32px;font-weight:900;color:#1a1a17;line-height:1.3;margin-bottom:16px;}
.blog-post-meta{display:flex;gap:16px;font-size:13px;color:#9ca3af;margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid #e5e7eb;}
.blog-post-content{font-size:16px;line-height:1.8;color:#374151;}
.blog-post-content h1,.blog-post-content h2,.blog-post-content h3{color:#1a1a17;margin:24px 0 12px;}
.blog-post-content img{max-width:100%;border-radius:8px;margin:16px 0;}
.blog-post-content blockquote{border-left:4px solid #d1a84b;padding:12px 20px;background:#fffbf0;margin:20px 0;border-radius:0 8px 8px 0;}
.blog-not-found{text-align:center;padding:80px;color:#9ca3af;}
.ql-toolbar,.ql-container{border:none!important;}
</style>
</head>
<body>
<!-- YOUR EXISTING HEADER/NAV HERE -->

<div class="blog-post-wrap" id="postContent">
  <div class="blog-not-found">Loading post...</div>
</div>

<!-- YOUR EXISTING FOOTER HERE -->

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const app = initializeApp({
  apiKey:"AIzaSyANFWqwFqFuWGNzjZS2crbr_WJ29eSDdRU",
  authDomain:"prestigevacations.firebaseapp.com",
  projectId:"prestigevacations",
  storageBucket:"prestigevacations.firebasestorage.app",
  messagingSenderId:"294803443782",
  appId:"1:294803443782:web:a3433f81c5af6a56153a47"
});
const db = getFirestore(app);

const id = new URLSearchParams(window.location.search).get('id');
const wrap = document.getElementById('postContent');

if (!id) { wrap.innerHTML='<div class="blog-not-found">Post not found.</div>'; }
else {
  const snap = await getDoc(doc(db,'blog_posts',id));
  if (!snap.exists() || snap.data().status!=='published') { wrap.innerHTML='<div class="blog-not-found">Post not found or not published yet.</div>'; }
  else {
    const p = snap.data();
    const dateStr = p.created?.toDate ? p.created.toDate().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'}) : '';
    document.getElementById('pageTitle').textContent = (p.seoTitle||p.title) + ' | Prestige Vacations';
    wrap.innerHTML = `
      ${p.coverUrl?`<img class="blog-hero" src="${p.coverUrl}" alt="${p.title}"/>`:''}
      <div class="blog-post-cat">${p.category||'Blog'}</div>
      <h1 class="blog-post-title">${p.title}</h1>
      <div class="blog-post-meta">
        <span>✍ ${p.author||'Prestige'}</span>
        <span>·</span>
        <span>${dateStr}</span>
      </div>
      <div class="blog-post-content ql-editor" style="padding:0;">${p.content||''}</div>
      <div style="margin-top:40px;padding-top:24px;border-top:1px solid #e5e7eb;">
        <a href="prestige-blog-index.html" style="color:#d1a84b;font-weight:600;text-decoration:none;">← Back to Blog</a>
      </div>`;
  }
}
</script>
</body>
</html>
