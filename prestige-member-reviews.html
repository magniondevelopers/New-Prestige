<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Member Reviews | Prestige Vacations & Clubs</title>
<style>
.reviews-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px;max-width:1200px;margin:0 auto;padding:0 20px;}
.review-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;position:relative;}
.review-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.review-avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid #d1a84b;flex-shrink:0;}
.review-avatar-init{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#C9A44B,#D9BA6F);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#1a1a17;flex-shrink:0;}
.review-name{font-weight:700;font-size:14px;color:#1a1a17;}
.review-source{font-size:11px;color:#9ca3af;}
.review-stars{color:#f59e0b;font-size:16px;margin-bottom:10px;}
.review-text{font-size:14px;color:#374151;line-height:1.7;}
.review-date{font-size:11px;color:#9ca3af;margin-top:12px;}
.google-badge{position:absolute;top:16px;right:16px;width:20px;height:20px;}
.reviews-empty{text-align:center;padding:80px;color:#9ca3af;}
</style>
</head>
<body>
<!-- YOUR EXISTING HEADER/NAV HERE -->

<section style="padding:60px 0;">
  <div style="text-align:center;margin-bottom:48px;">
    <h2>What Our Members Say</h2>
    <p style="color:#6b7280;">Real experiences from real Prestige members</p>
  </div>
  <div class="reviews-grid" id="reviewsGrid"><div class="reviews-empty">Loading reviews...</div></div>
</section>

<!-- YOUR EXISTING FOOTER HERE -->

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, collection, query, where, orderBy, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
const app = initializeApp({
  apiKey:"AIzaSyANFWqwFqFuWGNzjZS2crbr_WJ29eSDdRU",
  authDomain:"prestigevacations.firebaseapp.com",
  projectId:"prestigevacations",
  storageBucket:"prestigevacations.firebasestorage.app",
  messagingSenderId:"294803443782",
  appId:"1:294803443782:web:a3433f81c5af6a56153a47"
});
const db = getFirestore(app);

const snap = await getDocs(query(collection(db,'reviews'), where('status','==','published'), orderBy('created','desc')));
const grid = document.getElementById('reviewsGrid');
if (snap.empty) { grid.innerHTML='<div class="reviews-empty">No reviews yet.</div>'; }
else {
  const reviews = [];
  snap.forEach(d => reviews.push({id:d.id,...d.data()}));
  grid.innerHTML = reviews.map(r => `
    <div class="review-card">
      ${r.source==='Google'?`<img class="google-badge" src="https://www.google.com/favicon.ico" alt="Google"/>`:r.source==='Facebook'?`<img class="google-badge" src="https://facebook.com/favicon.ico" alt="Facebook"/>`:''}
      <div class="review-header">
        ${r.photoUrl?`<img class="review-avatar" src="${r.photoUrl}" alt="${r.name}"/>`:`<div class="review-avatar-init">${(r.name||'?')[0].toUpperCase()}</div>`}
        <div>
          <div class="review-name">${r.name}</div>
          <div class="review-source">${r.source||'Google'} Review</div>
        </div>
      </div>
      <div class="review-stars">${'★'.repeat(r.rating||5)}${'☆'.repeat(5-(r.rating||5))}</div>
      <div class="review-text">"${r.text}"</div>
      <div class="review-date">${r.reviewDate||''}</div>
    </div>`).join('');
}
</script>
</body>
</html>
